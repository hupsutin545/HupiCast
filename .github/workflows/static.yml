
<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <meta name="description" content="HupiCastin palvelutilanne, tunnetut häiriöt ja vianmääritysohjeet.">
  <title>HupiCast – palvelun tila</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1220;
      --panel: #121d30;
      --panel2: #17243a;
      --text: #edf4ff;
      --muted: #a8b7ce;
      --line: #2b3b55;
      --blue: #60a5fa;
      --yellow: #facc15;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: radial-gradient(ellipse at top, #172b49, var(--bg) 60%);
      color: var(--text);
      font: 16px/1.55 system-ui, sans-serif;
    }

    .wrap {
      width: min(920px, calc(100% - 32px));
      margin: auto;
      padding: 36px 0 50px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
    }

    .logo {
      display: grid;
      place-items: center;
      width: 50px;
      height: 50px;
      border-radius: 15px;
      background: linear-gradient(135deg, #60a5fa, #2563eb);
      color: #071326;
      font-size: 26px;
      font-weight: 900;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 5vw, 2.5rem);
      letter-spacing: -1px;
    }

    h2 { font-size: 1.2rem; }
    p { margin-top: 0; }

    .muted, .small { color: var(--muted); }
    .small { font-size: .9rem; }

    .hero, .card {
      border: 1px solid var(--line);
      background: linear-gradient(150deg, #15233a, #101a2b);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 18px;
    }

    .statusline {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.2rem;
      font-weight: 750;
    }

    .dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--yellow);
      box-shadow: 0 0 0 5px #facc1520;
      flex-shrink: 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .service {
      background: var(--panel2);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
    }

    .service strong { display: block; }
    .service-state { color: var(--yellow); font-size: .9rem; }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    button, .button {
      border: 1px solid #3b82f6;
      border-radius: 12px;
      padding: 11px 16px;
      background: #2563eb;
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    button:hover, .button:hover { background: #1d4ed8; }

    button.secondary, .button.secondary {
      background: transparent;
      border-color: var(--line);
      color: var(--text);
    }

    .notice {
      border-left: 4px solid var(--yellow);
      padding: 12px 14px;
      background: #facc1510;
      border-radius: 0 10px 10px 0;
      color: #fce9a4;
    }

    .faq {
      border-bottom: 1px solid var(--line);
      padding: 14px 0;
    }

    .faq:last-child { border-bottom: 0; }

    summary {
      cursor: pointer;
      font-weight: 700;
    }

    details p {
      margin: 10px 0 0;
      color: var(--muted);
    }

    .checklist {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .checklist li {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      background: var(--panel2);
      border-radius: 12px;
      padding: 12px;
    }

    .checklist input {
      margin-top: 5px;
      accent-color: var(--blue);
    }

    label { display: block; font-weight: 650; margin-bottom: 5px; }

    input[type="text"], select, textarea {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #0b1424;
      color: var(--text);
      font: inherit;
    }

    textarea { min-height: 100px; resize: vertical; }

    .report { display: grid; gap: 12px; }

    .report-result {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #08111f;
      border: 1px solid var(--line);
      padding: 14px;
      border-radius: 10px;
      display: none;
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: .9rem;
      padding-top: 12px;
    }

    @media (max-width: 620px) {
      .grid { grid-template-columns: 1fr; }
      .hero, .card { padding: 18px; }
    }
  </style>
</head>

<body>
<main class="wrap">

  <header>
    <div class="logo" aria-hidden="true">H</div>
    <div>
      <h1>HupiCast</h1>
      <p class="muted">Palvelun tila ja vianmääritys</p>
    </div>
  </header>

  <section class="hero">
    <div class="statusline">
      <span class="dot"></span>
      <span id="status-title">Tila ei ole varmennettu</span>
    </div>

    <p id="status-description">
      Tämä sivu ei ole yhteydessä HupiCastTV-laitteeseesi.
      Tarkista alla olevat yhteydet ja vianmääritysohjeet.
    </p>

    <p class="small">
      Sivun viimeisin tarkistus:
      <time id="last-check">ei vielä tarkistettu</time>
    </p>

    <div class="actions">
      <button id="refresh-status" type="button">Päivitä tila</button>
      <a class="button secondary" href="#troubleshooting">Vianmääritys</a>
    </div>
  </section>

  <section class="card">
    <h2>Tarkistettavat osat</h2>

    <div class="grid">
      <div class="service">
        <strong>HupiCast Android</strong>
        <span class="service-state">Tarkistettava laitteella</span>
        <p class="small">Kokeile käynnistää näytönpeilaus.</p>
      </div>

      <div class="service">
        <strong>HupiCastTV</strong>
        <span class="service-state">Tarkistettava televisiossa</span>
        <p class="small">Varmista, että TV-sovellus on käynnissä.</p>
      </div>

      <div class="service">
        <strong>Laitteiden etsintä</strong>
        <span class="service-state">Riippuu lähiverkosta</span>
        <p class="small">Molempien laitteiden tulee olla samassa verkossa.</p>
      </div>

      <div class="service">
        <strong>TCP-yhteys</strong>
        <span class="service-state">Portti 8765</span>
        <p class="small">Palomuuri voi estää yhteyden.</p>
      </div>
    </div>

    <p class="notice" style="margin-bottom:0;margin-top:16px">
      Tämä GitHub Pages -sivu ei automaattisesti mittaa
      HupiCastTV:n toimintaa. Tilatiedot ovat ohjeellisia.
    </p>
  </section>

  <section class="card" id="troubleshooting">
    <h2>Vianmääritys</h2>

    <div class="faq">
      <details>
        <summary>HupiCastTV ei löydy</summary>
        <p>
          Käynnistä HupiCastTV ja etsi laite uudelleen.
          Varmista, että molemmat laitteet ovat samassa Wi-Fi-verkossa.
          Reitittimen asiakaseristys voi estää laitteiden löytämisen.
        </p>
      </details>
    </div>

    <div class="faq">
      <details>
        <summary>Parituskoodi ei toimi</summary>
        <p>
          Käytä TV-sovelluksen nykyistä kuusinumeroista koodia.
          Jos TV-sovellus käynnistetään uudelleen, etsi laite uudestaan.
        </p>
      </details>
    </div>

    <div class="faq">
      <details>
        <summary>Näytönpeilaus ei käynnisty</summary>
        <p>
          Hyväksy Androidin näytönkaappauslupapyyntö.
          Käynnistä peilaus uudelleen ja varmista, että sovellus
          saa tarvittavat oikeudet.
        </p>
      </details>
    </div>

    <div class="faq">
      <details>
        <summary>Televisiossa ei näy kuvaa</summary>
        <p>
          Varmista, että yhteys muodostuu ja HupiCastTV on käynnissä.
          Tarkista myös sovellusten lokit ja TCP-portin 8765 yhteys.
        </p>
      </details>
    </div>

    <div class="faq">
      <details>
        <summary>Yhteys katkeaa tai kuva nykii</summary>
        <p>
          Tarkista Wi-Fi-yhteyden vakaus, siirrä laitteet lähemmäs
          reititintä ja käynnistä molemmat sovellukset uudelleen.
        </p>
      </details>
    </div>
  </section>

  <section class="card">
    <h2>Oma vianmääritystarkistus</h2>
    <p class="muted">Merkitse kokeilemasi vaiheet.</p>

    <ul class="checklist">
      <li>
        <input type="checkbox" id="c1">
        <label for="c1">Puhelin ja TV ovat samassa Wi-Fi-verkossa.</label>
      </li>
      <li>
        <input type="checkbox" id="c2">
        <label for="c2">HupiCastTV on käynnissä ja koodi on ajantasainen.</label>
      </li>
      <li>
        <input type="checkbox" id="c3">
        <label for="c3">Hyväksyin näytönkaappausluvan.</label>
      </li>
      <li>
        <input type="checkbox" id="c4">
        <label for="c4">Käynnistin molemmat sovellukset uudelleen.</label>
      </li>
    </ul>

    <div class="actions">
      <button class="secondary" type="button" id="reset-checks">
        Tyhjennä valinnat
      </button>
    </div>
  </section>

  <section class="card">
    <h2>Luo GitHub-vikailmoitus</h2>
    <p class="muted">
      Muodosta kopioitava vikailmoitusteksti. Lomake ei lähetä tietoja
      automaattisesti GitHubiin.
    </p>

    <form class="report" id="issue-form">
      <div>
        <label for="issue-type">Ongelma</label>
        <select id="issue-type">
          <option>HupiCastTV ei löydy</option>
          <option>Parituskoodi ei toimi</option>
          <option>Näytönpeilaus ei käynnisty</option>
          <option>TV:ssä ei näy kuvaa</option>
          <option>Yhteys katkeaa tai kuva nykii</option>
          <option>Muu ongelma</option>
        </select>
      </div>

      <div>
        <label for="android-version">Android-versio (valinnainen)</label>
        <input id="android-version" type="text" placeholder="Esim. Android 15">
      </div>

      <div>
        <label for="device">Laite (valinnainen)</label>
        <input id="device" type="text" placeholder="Laitteen malli">
      </div>

      <div>
        <label for="details">Mitä tapahtui?</label>
        <textarea id="details" required
          placeholder="Kuvaile ongelma ja mitä kokeilit. Älä lisää salasanoja tai parituskoodeja."></textarea>
      </div>

      <div class="actions">
        <button type="submit">Luo vikailmoitusteksti</button>
      </div>
    </form>

    <div class="report-result" id="report-result" aria-live="polite"></div>

    <div class="actions" id="report-actions" hidden>
      <button type="button" id="copy-report">Kopioi teksti</button>
      <a class="button secondary" id="github-link"
         href="https://github.com/" target="_blank"
         rel="noopener noreferrer">Avaa GitHub</a>
    </div>

    <p class="small">
      Muuta GitHub-linkki oman HupiCast-repositoriosi Issues-osoitteeksi.
    </p>
  </section>

  <footer>
    <p>HupiCast • Vianmäärityssivu</p>
    <p>Älä julkaise GitHubissa salasanoja, parituskoodeja tai muita yksityisiä tietoja.</p>
  </footer>

</main>

<script>
  const lastCheck = document.getElementById("last-check");
  const statusDescription = document.getElementById("status-description");

  function updateLocalTime() {
    lastCheck.textContent = new Date().toLocaleString("fi-FI");
  }

  document.getElementById("refresh-status").addEventListener("click", () => {
    updateLocalTime();
    statusDescription.textContent =
      "Sivun tarkistusaika päivitettiin. HupiCastTV:n todellista yhteyttä ei testattu.";
  });

  document.getElementById("reset-checks").addEventListener("click", () => {
    document.querySelectorAll(".checklist input[type=checkbox]")
      .forEach(box => box.checked = false);
  });

  let generatedReport = "";

  document.getElementById("issue-form").addEventListener("submit", event => {
    event.preventDefault();

    const type = document.getElementById("issue-type").value;
    const android =
      document.getElementById("android-version").value.trim() || "Ei ilmoitettu";
    const device =
      document.getElementById("device").value.trim() || "Ei ilmoitettu";
    const details = document.getElementById("details").value.trim();

    const checks = [...document.querySelectorAll(".checklist input[type=checkbox]")]
      .map(box => {
        const label = document.querySelector(`label[for="${box.id}"]`);
        return `- [${box.checked ? "x" : " "}] ${label.textContent.trim()}`;
      })
      .join("\n");

    generatedReport =
`## Ongelman kuvaus
${type}

## Laite ja ohjelmisto
- Android-versio: ${android}
- Laite: ${device}

## Mitä tapahtui?
${details}

## Kokeillut vaiheet
${checks}

## Lisätiedot
Älä lisää salasanoja, parituskoodeja tai muita yksityisiä tietoja.`;

    const result = document.getElementById("report-result");
    result.textContent = generatedReport;
    result.style.display = "block";
    document.getElementById("report-actions").hidden = false;
  });

  document.getElementById("copy-report").addEventListener("click", async () => {
    const button = document.getElementById("copy-report");

    try {
      await navigator.clipboard.writeText(generatedReport);
      button.textContent = "Kopioitu!";
    } catch (error) {
      const result = document.getElementById("report-result");
      const range = document.createRange();
      range.selectNodeContents(result);
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
      button.textContent = "Teksti valittu – kopioi";
    }
  });

  updateLocalTime();
</script>
</body>
</html>
